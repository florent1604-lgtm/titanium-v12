<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Titanium — Command Deck</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="deck">
      <header class="titlebar">
        <div class="product-mark">
          <span class="product-kicker">Titanium / CollabHub</span>
          <h1>Command Deck</h1>
        </div>
        <div class="system-state" aria-label="État du système : C1 shadow, lecture seule">
          <span class="state-lamp" aria-hidden="true"></span>
          <span>C1 SHADOW</span>
          <span class="state-divider" aria-hidden="true"></span>
          <span>LECTURE SEULE</span>
        </div>
        <p class="compact-guard" aria-label="Garde permanente">
          <span>PAPER ONLY</span><span aria-hidden="true">/</span><span>RÉEL INTERDIT</span>
        </p>
      </header>

      <main class="workspace" data-command-deck-root aria-live="polite">
        <p class="boot-state">Chargement du journal auditable…</p>
      </main>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
